<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<title>Moderation · AIETHOS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/country.css">
</head><body><main class="cp" id="cp"><div class="cp-top"><a href="../index.html">AIETHOS</a><span>Moderation</span></div><h1>Moderation queue</h1><div id="app"><p class="cp-note">Loading…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/config.js"></script><script src="../assets/notes.js"></script>
<script>
(async()=>{
const N=window.AIETHOS_NOTES,esc=N.esc,c=N.client(),app=document.getElementById('app');
const {data:{session}}=await c.auth.getSession();
if(!session){app.innerHTML='<p>Sign in with the moderator account.</p><button class="cp-btn" id="in">Sign in with LinkedIn</button>';document.getElementById('in').onclick=N.signIn;return;}
const {data:ok}=await c.rpc('is_admin');
if(!ok){app.innerHTML=`<p class="cp-msg err">This account is not a moderator.</p><p class="cp-note">User id: ${esc(session.user.id)}</p><button class="cp-btn alt" id="o">Sign out</button>`;document.getElementById('o').onclick=async()=>{await c.auth.signOut();location.reload()};return;}
async function load(){
 const [{data:cs},{data:ns}]=await Promise.all([c.from('contributors').select('*').eq('status','pending').order('created_at'),c.from('notes').select('*').eq('status','pending').order('created_at')]);
 app.innerHTML=`<h2>Contributor applications (${cs.length})</h2>`+(cs.map(x=>`<div class="cp-card"><h3>${esc(x.display_name)}</h3><p>${esc(x.expertise)}</p><p class="cp-note">${esc(x.country)} · <a href="${esc(x.linkedin_url)}" target="_blank" rel="noopener nofollow">${esc(x.linkedin_url)}</a> · applied ${esc(x.created_at.slice(0,10))}</p><textarea data-n="${x.user_id}" placeholder="Moderator note (shown to applicant if rejected)" rows="2" style="width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--bm)"></textarea><p><button class="cp-btn" data-c="${x.user_id}" data-s="approved">Approve</button> <button class="cp-btn alt" data-c="${x.user_id}" data-s="rejected">Reject</button></p></div>`).join('')||'<p class="cp-note">None waiting.</p>')+
 `<h2>Notes awaiting review (${ns.length})</h2>`+(ns.map(x=>`<div class="cp-card"><div class="cp-note">${esc(x.jurisdiction.toUpperCase())} · ${esc(x.kind)} · ${esc(x.created_at.slice(0,10))}</div><p>${esc(x.body)}</p>${x.source_url?`<p class="cp-note">Source: <a href="${esc(x.source_url)}" target="_blank" rel="noopener nofollow">${esc(x.source_url)}</a></p>`:''}<p class="cp-note"><b>${esc(x.author_name)}</b>, ${esc(x.author_expertise)} · <a href="${esc(x.author_linkedin)}" target="_blank" rel="noopener nofollow">LinkedIn</a></p><textarea data-nn="${x.id}" placeholder="Moderator note" rows="2" style="width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--bm)"></textarea><p><button class="cp-btn" data-t="${x.id}" data-s="approved">Publish</button> <button class="cp-btn alt" data-t="${x.id}" data-s="rejected">Reject</button></p></div>`).join('')||'<p class="cp-note">None waiting.</p>');
 app.querySelectorAll('button[data-c]').forEach(b=>b.onclick=async()=>{const n=app.querySelector(`[data-n="${b.dataset.c}"]`).value||null;await c.from('contributors').update({status:b.dataset.s,moderator_note:n,reviewed_at:new Date().toISOString()}).eq('user_id',b.dataset.c);load();});
 app.querySelectorAll('button[data-t]').forEach(b=>b.onclick=async()=>{const n=app.querySelector(`[data-nn="${b.dataset.t}"]`).value||null;await c.from('notes').update({status:b.dataset.s,moderator_note:n,reviewed_at:new Date().toISOString()}).eq('id',b.dataset.t);load();});
}
load();
})();
</script></body></html>
