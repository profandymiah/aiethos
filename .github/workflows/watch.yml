name: Watch for new AI policy documents
on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Install browser fallback
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Fetch tracked documents
        run: node build/fetch-library.js
      - name: Discover new items
        run: node build/discover.js
      - name: Build report and site data
        run: |
          node build/report.js
          node build/extract.js
      - name: Commit library updates
        run: |
          git config user.name "aiethos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add library data
          git rm -rq --cached node_modules 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Library update $(date -u +%F)"
          git pull --rebase -X theirs origin main
          node build/extract.js
          git add data
          git diff --cached --quiet || git commit -m "Rebuild data"
          git push
      - name: Open an issue when something changed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(cat library/has-news.txt 2>/dev/null)" = "yes" ]; then
            gh issue create --title "Policy watch $(date -u +%F): changes found" --body-file library/report.md
          fi
